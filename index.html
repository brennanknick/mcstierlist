<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCS</title>
<meta name="description" content="The Official Tierlist for MCS" />

<link rel="icon" href="assets/favicon.ico?v=2" sizes="32x32" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=2" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="theme-color" content="#0b0b0d" />

<!-- Discord / social embed. og:image must be absolute, not relative. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MCS" />
<meta property="og:title" content="MCS" />
<meta property="og:description" content="The Official Tierlist for MCS" />
<meta property="og:url" content="https://tiers.mcsoccer.net/" />
<meta property="og:image" content="https://tiers.mcsoccer.net/assets/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- ── left rail ─────────────────────────────────────────────── -->
  <aside class="rail">
    <a class="rail-logo" href="./" title="MCS tier list">
      <img class="rail-logo-mark" src="assets/mcs-logo.png" alt="MCS" />
    </a>

    <nav class="rail-nav">
      <button class="rail-btn" id="btn-search" title="Search players" aria-label="Search players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
      </button>

      <button class="rail-btn" id="btn-filter" title="Filter tiers" aria-label="Filter tiers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="17" x2="14" y2="17"/></svg>
      </button>

      <span class="rail-sep"></span>

      <a class="rail-btn" id="btn-discord" href="#" title="Discord" aria-label="Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="fill">
          <path d="M19.3 5.3A16.6 16.6 0 0 0 15.2 4l-.2.4a15.5 15.5 0 0 1 3.6 1.2 12.6 12.6 0 0 0-10.9 0A15.5 15.5 0 0 1 11.2 4.4L11 4a16.6 16.6 0 0 0-4.1 1.3C4.3 9.2 3.6 13 4 16.7a16.7 16.7 0 0 0 5 2.6l.7-1.2a10.8 10.8 0 0 1-1.7-.8l.4-.3a11.9 11.9 0 0 0 9.3 0l.4.3a10.8 10.8 0 0 1-1.7.8l.7 1.2a16.7 16.7 0 0 0 5-2.6c.5-4.3-.6-8.1-2.8-11.4ZM9.6 14.6c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm4.8 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>
        </svg>
      </a>
    </nav>

    <div class="rail-foot" id="rail-count">0</div>
  </aside>

  <!-- ── board ─────────────────────────────────────────────────── -->
  <main class="board">

    <!-- search bar (slides down) -->
    <div class="searchbar" id="searchbar" hidden>
      <svg viewBox="0 0 24 24" class="searchbar-icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
      <input type="text" id="search-input" placeholder="search player…" spellcheck="false" autocomplete="off" />
      <span class="searchbar-hint" id="search-hint"></span>
      <button class="searchbar-close" id="search-close" aria-label="Close search">esc</button>
    </div>

    <!-- filter bar (slides down) -->
    <div class="filterbar" id="filterbar" hidden>
      <span class="filterbar-label">show</span>
      <button class="chip is-on" data-band="high">high tier</button>
      <button class="chip is-on" data-band="low">low tier</button>
      <span class="filterbar-sep"></span>
      <span class="filterbar-label">tiers</span>
      <div class="chips" id="tier-chips"></div>
    </div>

    <div class="columns" id="columns"><!-- rendered by app.js --></div>
  </main>

</div>

<!-- ── player card ─────────────────────────────────────────────── -->
<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true">
    <button class="card-close" id="card-close" aria-label="Close">×</button>
    <div class="card-body">
      <img class="card-skin" id="card-skin" alt="" />
      <div class="card-info">
        <div class="card-rank" id="card-rank">HT1</div>
        <h2 class="card-name" id="card-name">player</h2>
        <div class="card-meta" id="card-meta"></div>
        <div class="card-links">
          <a id="card-namemc" href="#" target="_blank" rel="noopener noreferrer">namemc ↗</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
